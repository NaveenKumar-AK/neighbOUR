<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NeighbOUR</title>
  <link rel="stylesheet" href="serviceproviderstyle.css">
</head>
<body>

<div class="bg"></div>

<!-- LOGIN CARD -->
<div class="card" id="loginCard">
  <h1 class="title">NeighbOUR</h1>
  <p class="subtitle">Welcome back</p>

  <div class="form">
    <input type="text" placeholder="Email or phone">
    <input type="password" placeholder="Password">

    <div class="remember-row">
      <label class="remember">
        <input type="checkbox">
        <span>Remember me</span>
      </label>
      <a href="#" class="forgot">Forgot password?</a>
    </div>

    <!-- CAPTCHA Section -->
    <div class="captcha-section" style="margin: 12px 0; padding: 10px; background: #f5f5f5; border-radius: 8px; text-align: center;">
      <label style="display: block; margin-bottom: 6px; font-weight: bold; font-size: 13px;">Security Verification</label>
      <div class="captcha-box" id="captcha" style="font-size: 20px; font-weight: bold; letter-spacing: 4px; background: #fff; padding: 8px 15px; display: inline-block; margin-bottom: 8px; user-select: none; border: 1px solid #ddd; border-radius: 4px;"></div><br>
      <input type="text" id="captchaInput" placeholder="Enter code" style="margin: 6px 0; padding: 6px; font-size: 13px; width: 150px;">
      <button type="button" onclick="generateCaptcha()" style="padding: 5px 10px; margin-left: 5px; cursor: pointer; background: #f0f0f0; border: 1px solid #ccc; border-radius: 4px; font-size: 12px;">Refresh</button>
    </div>

    <button class="btn blue" onclick="return validateLogin()">Login</button>

    <div class="divider">or</div>

    <button class="social">
      <img src="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/google/google-original.svg">
      Continue with Google
    </button>

    <button class="social">
      <img src="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/facebook/facebook-original.svg">
      Continue with Facebook
    </button>

    <p class="switch">
      Don’t have an account?
      <a onclick="showRegister()">Create account</a>
    </p>
  </div>
</div>

<!-- REGISTER CARD -->
<div class="card wide" id="registerCard" style="display:none;">
  <h1 class="title">Create account</h1>

  <div class="upload-wrap">
    <label class="upload" id="avatarLabel">
      +
      <input id="profilePhoto" name="profilePhoto" type="file" accept="image/*">
    </label>
  </div>

  <div class="form grid" id="registerForm">
    <input id="fullName" name="fullName" placeholder="Full Name">
    <input id="phone" name="phone" placeholder="Phone Number">

    <input id="email" name="email" placeholder="Email Address" class="wide">

    <input id="pass" name="password" type="password" placeholder="Password" onkeyup="strength()">
    <input id="confirmPass" name="confirmPassword" type="password" placeholder="Confirm Password">
    <div class="strength wide"><div id="bar"></div></div>

    <input id="location" name="location" placeholder="Location / Service Area" class="wide">

    <label class="wide">
      Service Category
      <select id="serviceCategory" name="serviceCategory">
        <option value="">-- Select category --</option>
        <option>Plumbing</option>
        <option>Electrical</option>
        <option>Cleaning</option>
        <option>Carpentry</option>
        <option>Tutoring</option>
        <option>Computer / IT</option>
        <option>Gardening</option>
        <option>Delivery</option>
        <option>Beauty / Wellness</option>
        <option>Other</option>
      </select>
    </label>
    <input id="serviceOther" name="serviceOther" placeholder="If Other, describe" class="wide" style="display:none;">

    <textarea id="skills" name="skills" placeholder="Skills Description (brief)" class="wide"></textarea>

    <input id="experience" name="experience" type="number" min="0" max="100" placeholder="Experience (years)">
    <input id="pricing" name="pricing" type="number" min="0" step="0.01" placeholder="Pricing Range (hourly rate)">

    <div class="availability wide" id="availability">
      <div class="day-pills">
        <button type="button" class="day-pill" data-day="mon">Mon</button>
        <button type="button" class="day-pill" data-day="tue">Tue</button>
        <button type="button" class="day-pill" data-day="wed">Wed</button>
        <button type="button" class="day-pill" data-day="thu">Thu</button>
        <button type="button" class="day-pill" data-day="fri">Fri</button>
        <button type="button" class="day-pill" data-day="sat">Sat</button>
        <button type="button" class="day-pill" data-day="sun">Sun</button>
      </div>
      <div style="grid-column:span 2; display:flex; gap:8px; margin-top:8px;">
        <input type="time" id="availStart" name="availStart">
        <input type="time" id="availEnd" name="availEnd">
      </div>
      <input type="hidden" id="selectedDays" name="selectedDays">
    </div>

    <div class="file-upload wide">
      <label class="file-btn">
        Upload ID Proof
        <input id="idProof" name="idProof" type="file" accept=".pdf,image/*">
      </label>
      <span class="file-name" id="idProofName">No file chosen</span>
    </div>
    <div class="file-upload wide">
      <label class="file-btn">
        Upload Certifications / Licenses (optional)
        <input id="certs" name="certs" type="file" multiple>
      </label>
      <span class="file-name" id="certsName">No files chosen</span>
    </div>

    <input id="bankName" name="bankName" placeholder="Bank name (optional)">
    <input id="bankAcc" name="bankAcc" placeholder="Account number (optional)">

    <!-- CAPTCHA Section for Registration -->
    <div class="captcha-section wide" style="margin: 12px 0; padding: 10px; background: #f5f5f5; border-radius: 8px; text-align: center;">
      <label style="display: block; margin-bottom: 6px; font-weight: bold; font-size: 13px;">Security Verification</label>
      <div class="captcha-box" id="captcha" style="font-size: 20px; font-weight: bold; letter-spacing: 4px; background: #fff; padding: 8px 15px; display: inline-block; margin-bottom: 8px; user-select: none; border: 1px solid #ddd; border-radius: 4px;"></div><br>
      <input type="text" id="captchaInput" placeholder="Enter code" style="margin: 6px 0; padding: 6px; font-size: 13px; width: 150px;">
      <button type="button" onclick="generateCaptcha()" style="padding: 5px 10px; margin-left: 5px; cursor: pointer; background: #f0f0f0; border: 1px solid #ccc; border-radius: 4px; font-size: 12px;">Refresh</button>
    </div>
  </div>

  <div class="terms">
    <label class="check">
      <input id="agreeTerms" type="checkbox">
      <span>I agree to Terms & Conditions</span>
    </label>
    <label class="check">
      <input id="agreePrivacy" type="checkbox">
      <span>I accept Privacy Policy</span>
    </label>
  </div>

  <button class="btn green" id="providerRegister" onclick="return validateRegister()">Register as Provider</button>

  <p class="switch">
    Already have an account?
    <a onclick="showLogin()">Login</a>
  </p>
</div>

<script src="sploginscript.js"></script>
</body>
</html>
